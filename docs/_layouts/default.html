<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}TFM2 Editor</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">TFM2 Editor</a>
      <nav class="nav">
        <a href="{{ '/' | relative_url }}">Guide</a>
        <a href="{{ '/installation.html' | relative_url }}">Installation</a>
        <a href="{{ '/features.html' | relative_url }}">Features</a>
        <a href="https://github.com/jal-io/tfm2-editor">GitHub</a>
        <a class="download" href="https://github.com/jal-io/tfm2-editor/releases">Download</a>
      </nav>
    </div>
  </header>

  <main class="shell content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell">TFM2 Editor by jal-io · Unofficial community project</div>
  </footer>
</body>

</html>
